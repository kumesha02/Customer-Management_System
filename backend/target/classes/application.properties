# ============================================================================
# 🎓 SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================
# Spring Boot uses these properties to configure the application automatically.
# This is "Convention over Configuration" - sensible defaults with customization.
# ============================================================================

# ----------------------------------------------------------------------------
# APPLICATION SETTINGS
# ----------------------------------------------------------------------------
spring.application.name=customer-management-system
server.port=8080

# ----------------------------------------------------------------------------
# 🎓 DATABASE CONFIGURATION (MariaDB)
# ----------------------------------------------------------------------------
# CONCEPT: DataSource
# A DataSource is a factory for database connections. Spring Boot creates
# and manages a connection pool automatically using HikariCP (the fastest!)
# ----------------------------------------------------------------------------

# JDBC URL format: jdbc:mariadb://host:port/database_name
spring.datasource.url=jdbc:mariadb://localhost:3306/customer_management
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ----------------------------------------------------------------------------
# 🎓 CONNECTION POOL SETTINGS (HikariCP)
# ----------------------------------------------------------------------------
# CONCEPT: Connection Pooling
# Creating database connections is expensive. A pool maintains ready-to-use
# connections. When you need one, you borrow it; when done, you return it.
# This dramatically improves performance!
# ----------------------------------------------------------------------------

# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=20

# Minimum idle connections
spring.datasource.hikari.minimum-idle=5

# Connection timeout (30 seconds)
spring.datasource.hikari.connection-timeout=30000

# Maximum lifetime of a connection (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# ----------------------------------------------------------------------------
# 🎓 JPA / HIBERNATE CONFIGURATION
# ----------------------------------------------------------------------------
# CONCEPT: ORM (Object-Relational Mapping)
# JPA lets you work with Java objects instead of SQL. Hibernate is the
# implementation that translates your object operations into SQL queries.
# ----------------------------------------------------------------------------

# Show SQL queries in console (useful for learning/debugging)
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# Dialect: Tells Hibernate which database you're using so it generates correct SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect

# ----------------------------------------------------------------------------
# 🎓 SCHEMA MANAGEMENT STRATEGY
# ----------------------------------------------------------------------------
# CONCEPT: DDL Auto
# - none: Do nothing (use this in production)
# - validate: Check if schema matches entities (safe for production)
# - update: Update schema to match entities (convenient for development)
# - create: Create schema, destroy previous data
# - create-drop: Create on startup, drop on shutdown
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

# Enable lazy loading outside transactions (not recommended for production, but useful for learning)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ----------------------------------------------------------------------------
# 🎓 BATCH PROCESSING OPTIMIZATION
# ----------------------------------------------------------------------------
# CONCEPT: Batch Operations
# Instead of sending 1000 individual INSERT queries, batch them into
# groups (e.g., 50 at a time). This reduces network roundtrips.
# ----------------------------------------------------------------------------

# JDBC batch size for bulk inserts
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Order inserts/updates for batching efficiency
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Batch versioned entities
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ----------------------------------------------------------------------------
# 🎓 LOGGING CONFIGURATION
# ----------------------------------------------------------------------------
# Control what gets logged and at what level
# Levels: TRACE < DEBUG < INFO < WARN < ERROR
# ----------------------------------------------------------------------------

# Root logging level
logging.level.root=INFO

# Show SQL parameters (the ? values in prepared statements)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Our application logging
logging.level.com.cms=DEBUG

# Show transaction details
logging.level.org.springframework.transaction=DEBUG

# ----------------------------------------------------------------------------
# 🎓 FILE UPLOAD SETTINGS
# ----------------------------------------------------------------------------
# CONCEPT: Multipart File Upload
# These settings control how Spring handles file uploads (like Excel files)
# ----------------------------------------------------------------------------

# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Max file size (100MB for large Excel files)
spring.servlet.multipart.max-file-size=100MB

# Max request size (100MB)
spring.servlet.multipart.max-request-size=100MB

# ----------------------------------------------------------------------------
# 🎓 JSON SERIALIZATION SETTINGS
# ----------------------------------------------------------------------------
# Jackson is the library that converts Java objects to JSON and vice versa
# ----------------------------------------------------------------------------

# Pretty print JSON responses (easier to read)
spring.jackson.serialization.indent-output=true

# Don't fail on unknown properties
spring.jackson.deserialization.fail-on-unknown-properties=false

# Format dates as ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false

# ----------------------------------------------------------------------------
# 🎓 CORS CONFIGURATION
# ----------------------------------------------------------------------------
# CONCEPT: Cross-Origin Resource Sharing
# By default, browsers block requests from different origins (e.g., React on
# port 3000 calling API on port 8080). CORS headers tell browsers it's OK.
# We'll configure this in code (CorsConfig.java) for more control.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# INITIALIZATION SETTINGS
# ----------------------------------------------------------------------------
# Run schema.sql and data.sql on startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Run schema.sql before Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
